<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found — Civic projects</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f4;
        --fg: #16161a;
        --muted: #5c5c66;
        --line: #d9d9d2;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0e11;
          --fg: #f2f2ef;
          --muted: #9a9aa5;
          --line: #2a2a31;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        max-width: 34rem;
      }

      p.code {
        margin: 0 0 0.5rem;
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        line-height: 1.2;
      }

      p {
        color: var(--muted);
      }

      a {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.6rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        color: inherit;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        border-color: currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>There is nothing at this address</h1>
      <p>
        The page may have moved, or the link may be wrong. Every project on this host lives at its
        own path from the index.
      </p>
      <a href="/">Back to the project index</a>
    </main>
  </body>
</html>
