name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout digital host
        uses: actions/checkout@v4
        with:
          path: digital-public-administration-lab

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            digital-public-administration-lab/pnpm-lock.yaml

      - name: Prepare pinned sibling
        run: pnpm setup:sibling
        working-directory: digital-public-administration-lab

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: digital-public-administration-lab

      - name: Verify
        run: pnpm verify && pnpm smoke
        working-directory: digital-public-administration-lab

  verify:
    name: verify
    if: ${{ always() }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
