name: Uptime

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            src
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-live-paths.mjs --strict
